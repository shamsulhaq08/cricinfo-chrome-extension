<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Cricket Scores</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="widget-wrapper">
    <!-- Header with Classic Cricket Logo and Reflection -->
    <header class="widget-header">
      <a href="https://www.espncricinfo.com" target="_blank" rel="noopener noreferrer" class="logo-container" id="cricinfoLogoLink" title="View Live Cricket Scores">
        <svg class="cricinfo-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 46" width="170" height="38">
          <defs>
            <linearGradient id="reflectGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="cricketBallGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ef4444"/>
              <stop offset="60%" stop-color="#b91c1c"/>
              <stop offset="100%" stop-color="#7f1d1d"/>
            </linearGradient>
            <mask id="reflectMask">
              <rect x="0" y="21" width="210" height="25" fill="url(#reflectGradient)"/>
            </mask>
            <g id="logoText">
              <!-- Classic Red Cricket Ball Icon -->
              <circle cx="11" cy="11.5" r="9" fill="url(#cricketBallGrad)" stroke="#991b1b" stroke-width="0.8"/>
              <path d="M 6.5,5.5 Q 12,11.5 6.5,17.5" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="1.2,1.2" fill="none"/>
              <!-- Red Bold Italic CRIC -->
              <text x="25" y="19" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="20.5" fill="#cc0000" letter-spacing="-0.3">CRIC</text>
              <!-- White Cut Line -->
              <line x1="24" y1="11.5" x2="68" y2="11.5" stroke="#ffffff" stroke-width="1.6"/>
              <!-- Blue Classic Text -->
              <text x="73" y="19" class="logo-cricinfo-text" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="bold" font-size="20.5" fill="#004b79" letter-spacing="-0.4">classic</text>
            </g>
          </defs>
          <!-- Primary Logo -->
          <use href="#logoText"/>
          <!-- Mirror Reflection -->
          <g transform="translate(0, 39) scale(1, -0.75)" mask="url(#reflectMask)">
            <use href="#logoText"/>
          </g>
        </svg>
      </a>

      <div class="header-actions">
        <button id="btnSidePanel" class="header-btn sidepanel-btn" title="Open in Chrome Side Panel" aria-label="Open in Chrome Side Panel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="15" y1="3" x2="15" y2="21"></line>
            <path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4V4z" fill="currentColor" stroke="none" opacity="0.35"></path>
          </svg>
        </button>
        <button id="btnThemeToggle" class="header-btn theme-toggle-btn" title="Toggle Day/Night Mode" aria-label="Toggle Theme">
          <svg id="themeIconSun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="themeIconMoon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button id="btnHeaderRefresh" class="header-btn" title="Refresh Live Scores" aria-label="Refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
        <button id="btnSettings" class="gear-btn" title="Widget Settings" aria-label="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#777777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- SECTION 1: Matches Box (Tabs: Live Scores | Upcoming) -->
    <section class="classic-box box-live-scores">
      <div class="box-header-row box-tabs-row">
        <div class="box-tabs-group">
          <button type="button" class="box-tab-btn active" id="tabLiveBtn">
            <span class="live-dot-pulse" title="Live Cricket"></span>Live Scores
          </button>
          <button type="button" class="box-tab-btn" id="tabUpcomingBtn">Upcoming</button>
        </div>
        <div class="realtime-status-indicator" id="realtimeStatusIndicator" title="Live Auto-Refresh Active (Every 5s)">
          <span class="realtime-dot"></span>
          <span class="realtime-text" id="realtimeStatusText">5s</span>
        </div>
      </div>

      <div class="box-content" id="liveScoresContent">
        <div class="loading-state">Loading live scores...</div>
      </div>

      <div class="box-content" id="upcomingScoresContent" style="display: none;">
        <div class="loading-state">Loading upcoming matches...</div>
      </div>

      <div class="box-footer">
        <a href="https://www.espncricinfo.com/live-cricket-score" target="_blank" rel="noopener noreferrer" class="more-link" id="moreMatchesLink">more scores &raquo;</a>
      </div>
    </section>

    <!-- SECTION 2: Latest News Box -->
    <section class="classic-box box-latest-news">
      <h2 class="box-title">Latest News</h2>

      <div class="box-content" id="latestNewsContent">
        <div class="loading-state">Loading latest news...</div>
      </div>

      <div class="box-footer">
        <a href="https://www.espncricinfo.com/cricket-news" target="_blank" rel="noopener noreferrer" class="more-link">more news &raquo;</a>
      </div>
    </section>

    <!-- SETTINGS PANEL (Slides over when gear is clicked) -->
    <div class="settings-overlay" id="settingsOverlay" style="display:none;">
      <div class="settings-modal">
        <div class="settings-header">
          <h3>Widget Settings</h3>
          <button id="btnCloseSettings" class="btn-close-modal" title="Close">&times;</button>
        </div>
        <div class="settings-body">
          <div class="setting-row">
            <label for="selectRefreshInterval">Auto-Refresh Interval:</label>
            <select id="selectRefreshInterval" class="classic-select">
              <option value="5" selected>⚡ Real-Time (5 seconds)</option>
              <option value="10">⚡ Fast (10 seconds)</option>
              <option value="15">15 seconds</option>
              <option value="30">30 seconds</option>
              <option value="60">1 minute</option>
              <option value="120">2 minutes</option>
              <option value="0">Off (Manual)</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="selectFilterScope">Match Scope:</label>
            <select id="selectFilterScope" class="classic-select">
              <option value="intl">International Only (No domestic / local)</option>
              <option value="all">All Matches</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="selectTheme">Mode / Theme:</label>
            <select id="selectTheme" class="classic-select">
              <option value="light">☀️ Day Mode (Light)</option>
              <option value="dark">🌙 Night Mode (Dark)</option>
              <option value="auto">💻 System Automatic</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="selectTimeZone">Region / Time Zone:</label>
            <select id="selectTimeZone" class="classic-select">
              <option value="Asia/Karachi" selected>🇵🇰 Pakistan (PKT, UTC+5)</option>
              <option value="Asia/Kolkata">🇮🇳 India / Sri Lanka (IST, UTC+5:30)</option>
              <option value="Asia/Dhaka">🇧🇩 Bangladesh (BST, UTC+6)</option>
              <option value="Asia/Dubai">🇦🇪 UAE / Gulf (GST, UTC+4)</option>
              <option value="Europe/London">🇬🇧 United Kingdom (GMT/BST)</option>
              <option value="Australia/Sydney">🇦🇺 Australia - Sydney/Melb (AEST)</option>
              <option value="Australia/Perth">🇦🇺 Australia - Perth (AWST)</option>
              <option value="Pacific/Auckland">🇳🇿 New Zealand (NZST)</option>
              <option value="Africa/Johannesburg">🇿🇦 South Africa (SAST, UTC+2)</option>
              <option value="America/Port_of_Spain">🌴 West Indies (AST, UTC-4)</option>
              <option value="America/New_York">🇺🇸 USA / Canada Eastern (EST)</option>
              <option value="America/Los_Angeles">🇺🇸 USA / Canada Pacific (PST)</option>
              <option value="auto">🌐 Auto (Device System Time)</option>
              <option value="UTC">🌐 UTC (Universal Time)</option>
            </select>
          </div>
          <div class="setting-row actions-row">
            <button id="btnManualRefresh" class="btn-classic-action">🔄 Refresh Now</button>
            <button id="btnSaveSettings" class="btn-classic-save">Done</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="fallback-data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
